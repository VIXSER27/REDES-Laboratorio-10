name: deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en el registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen con el tag del commit
        run: |
          TAG=${GITHUB_SHA::7}
          echo "TAG=$TAG" >> $GITHUB_ENV
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/pagosya-api:$TAG"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build --build-arg APP_VERSION="$TAG" -t "$IMAGE" app/

      - name: Arrancar contenedor y correr smoke test
        run: |
          docker run -d --name api-test -p 8080:8000 "$IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "Smoke test pasó para $TAG"
              docker rm -f api-test
              exit 0
            fi
            sleep 0.5
          done
          echo "Smoke test falló para $TAG" >&2
          docker rm -f api-test
          exit 1

      - name: Publicar imagen solo si el smoke pasó
        run: docker push "$IMAGE"
